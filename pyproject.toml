[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structured-meal-grocery-planner"
version = "1.0.0"
description = "Production-ready multi-agent weekly meal & grocery planner powered by CrewAI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Meal Planner Team" }
]
keywords = ["crewai", "multi-agent", "meal-planning", "grocery", "pydantic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "crewai>=0.118.0",
  "crewai-tools>=0.40.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "httpx>=0.27.0",
]

[project.scripts]
meal-planner = "meal_planner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_planner"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "config"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/config",
  "/tests",
  "/examples",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["meal_planner"]
